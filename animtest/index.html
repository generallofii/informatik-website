<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Ultra - Multi-Video Scrubber Sequence</title>
  
  <link rel="stylesheet" href="/animtest/css/style.css">
  
  <!-- CDNS for Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js" defer></script>
  <script src="/animtest/js/main.js" defer></script>
</head>
<body>

  <div class="scroll-container">
    
    <section class="video-track">
      <div class="sticky-viewport">
        
        <!-- Absolute Stack Container -->
        <div class="video-wrapper">
          <!-- Video 1: Initial Animation Sequence -->
          <video id="video-1" class="scrub-video active" src="large.mp4" playsinline muted preload="auto"></video>
          <!-- Video 2: Secondary Animation Sequence -->
          <video id="video-2" class="scrub-video" src="large1.mp4" playsinline muted preload="auto"></video>
        </div>

        <div class="text-overlay">
          <h1 id="dynamic-title" class="scroll-title">The future unfolds.</h1>
        </div>

      </div>
    </section>

    <section class="spacer-section">
      <div class="spacer-content">
        <h2>Pro Camera System.</h2>
        <p>Our most advanced video performance engine ever designed for the web layout.</p>
      </div>
    </section>

  </div>

</body>
</html>
