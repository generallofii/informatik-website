<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Ultra - Sequential Video Track System</title>
  
  <link rel="stylesheet" href="/animtest/style.css">
  
  <!-- CDNS for Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js" defer></script>
  <script src="/animtest/js/main.js" defer></script>
</head>
<body>

  <div class="scroll-container">
    
    <!-- FIRST VIDEO TIMELINE BLOCK -->
    <section id="track-1" class="video-track">
      <div class="sticky-viewport">
        <div class="video-wrapper">
          <video id="video-1" class="scrub-video" src="large2.mp4" playsinline muted preload="auto"></video>
        </div>
        <div class="text-overlay">
          <h1 class="scroll-title">The future unfolds.</h1>
        </div>
      </div>
    </section>

    <!-- SECOND VIDEO TIMELINE BLOCK -->
    <section id="track-2" class="video-track">
      <div class="sticky-viewport">
        <div class="video-wrapper">
          <video id="video-2" class="scrub-video" src="large.mp4" playsinline muted preload="auto"></video>
        </div>
        <div class="text-overlay">
          <h1 class="scroll-title">Pro power. Pro display.</h1>
        </div>
      </div>
    </section>

    <!-- FLOW CONTENT FOOTER -->
    <section class="spacer-section">
      <div class="spacer-content">
        <h2>Pro Camera System.</h2>
        <p>Our most advanced video performance engine ever designed for the web layout.</p>
      </div>
    </section>

  </div>

</body>
</html>
